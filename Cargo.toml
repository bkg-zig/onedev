[workspace]
resolver = "2"
members = [
    "crates/onedev-core",
    "crates/onedev-db",
    "crates/onedev-auth",
    "crates/onedev-api",
    "crates/onedev-server",
    "crates/onedev-git",
    "crates/onedev-build",
    "crates/onedev-web",
    "crates/onedev-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/bkg-zig/onedev"
description = "OneDev Rust Rewrite - Complete Git Server with CI/CD, Issue Tracking, Code Review"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.49", features = ["full", "tracing"] }
tokio-util = { version = "0.7", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["macros", "json", "multipart", "ws"] }
axum-extra = { version = "0.9", features = ["cookie", "cookie-signed", "cookie-private"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "catch-panic", "compression-br", "compression-gzip", "compression-deflate", "normalize-path", "request-id", "set-header", "timeout"] }
hyper = { version = "1.3", features = ["full"] }
http = "1.3"
http-body = "1.0"
http-body-util = { version = "0.1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Database
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "sqlite", "uuid", "chrono", "json", "migrate", "macros"] }
deadpool = { version = "0.13", features = ["managed", "rt_tokio_1"] }
deadpool-postgres = { version = "0.13", features = ["serde"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }

# Authentication & Security
argon2 = "0.5"
ring = "0.17"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
aes-gcm = "0.10"
x25519-dalek = "3.0"
ed25519-dalek = "3.0"
rand = { version = "0.9", features = ["std", "os_rng"] }
rand_core = "0.6"
getrandom = { version = "0.3", features = ["std"] }
subtle = "2.6"
zeroize = { version = "1.8", features = ["derive"] }
secrecy = "0.10"
jsonwebtoken = "9.3"
rsa = { version = "0.9.10", features = ["getrandom", "pem"] }
qrcode = { version = "0.14", features = ["svg"] }
oauth2 = { version = "5.0", features = ["reqwest", "pkce-plain"] }
totp-lite = "2.0"
base64 = { version = "0.22", features = ["std"] }
base64ct = { version = "1.6", features = ["alloc"] }
regex = { version = "1.10", features = ["unicode", "std", "perf", "perf-dfa", "perf-literal", "perf-cache"] }
digest = "0.10"
md5 = "0.7"

# Git
gix = { version = "0.72", features = ["blocking-http-transport-reqwest", "parallel", "max-performance"] }
gix-features = "0.41"
gix-object = "0.47"
gix-pack = "0.55"
gix-transport = { version = "0.47", features = ["http-client-reqwest", "blocking-client"] }
gix-protocol = "0.47"
gix-ref = "0.47"
gix-index = "0.37"
gix-worktree = "0.38"
gix-config = "0.41"
gix-url = "0.30"
gix-credentials = "0.28"
gix-sec = "0.14"
gix-hash = "0.16"
gix-date = "0.10"
gix-trace = "0.3"
gix-chunk = "0.5"
gix-packetline = "0.19"
gix-odb = "0.68"

# Templates
tera = { version = "1.20", features = ["humansize"] }
askama = { version = "0.13", features = ["default"] }
markdown = "1.0"
pulldown-cmark = { version = "0.13", features = ["simd", "html"] }
syntect = { version = "5.3", features = ["default", "parsing", "dump-create", "dump-load", "html"] }

# Observability
tracing = { version = "0.1", features = ["std", "log", "valuable"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "registry"] }
tracing-appender = { version = "0.2", features = ["non-blocking"] }
# tracing-opentelemetry temporarily disabled due to version conflicts
# tracing-opentelemetry = { version = "0.34", features = ["trace", "metrics"] }
# opentelemetry = { version = "0.29", features = ["trace", "metrics", "logs"] }
# opentelemetry-otlp = { version = "0.29", features = ["tonic", "http", "metrics", "logs", "trace"] }
# opentelemetry_sdk = { version = "0.29", features = ["trace", "metrics", "logs"] }
metrics = "0.23"
metrics-exporter-prometheus = "0.16"

# Config
config = { version = "0.14", features = ["yaml", "json", "toml"] }
figment = { version = "0.10", features = ["yaml", "json", "toml", "env"] }

# CLI
clap = { version = "4.5", features = ["derive", "env", "wrap_help", "color", "suggestions", "cargo"] }
clap_complete = "4.5"
console = "0.15"
indicatif = { version = "0.17", features = ["rayon", "unicode-width"] }
dialoguer = "0.11"

# Utilities
anyhow = "1.0"
async-trait = "0.1"
thiserror = "2.0"
validator = { version = "0.19", features = ["derive"] }
eyre = "0.6"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "local-offset"] }
uuid = { version = "1.21", features = ["serde", "v4", "v7", "fast-rng"] }
ulid = "3.0"
bytes = { version = "1.9", features = ["serde"] }
mime = "0.3"
mime_guess = "2.0"
percent-encoding = "2.3"
url = { version = "2.5", features = ["serde"] }
urlencoding = "2.1"
pathdiff = "0.2"
walkdir = "2.5"
ignore = "0.4"
glob = "0.3"
lazy_static = "1.4"
once_cell = { version = "1.19", features = ["race"] }
parking_lot = { version = "0.12", features = ["arc_lock", "deadlock_detection"] }
dashmap = { version = "6.1", features = ["rayon"] }
crossbeam = "0.8"
flume = "0.11"
async-channel = "2.3"
futures = { version = "0.3", features = ["std", "async-await"] }
pin-project = { version = "1.1", features = ["unsafe-pinned-drop-projection"] }
scopeguard = "1.2"
indexmap = "2.0"
smallvec = "1.12"

# Testing
testcontainers = { version = "0.20", features = ["tokio", "postgres", "redis"] }
mockall = { version = "0.13", features = ["nightly"] }
wiremock = { version = "0.5", features = ["actix", "tokio", "tls"] }
proptest = "1.4"
pretty_assertions = "1.4"
insta = { version = "1.37", features = ["json", "ron", "yaml", "csv"] }

# Compression
flate2 = "1.0"
zstd = { version = "0.13", features = ["multithreading"] }
bzip2 = "0.4"
tar = "0.4"

# Async file I/O
tokio-fs = "1.0"
async-compression = { version = "0.4", features = ["tokio", "gzip", "zstd", "brotli"] }

# Email
lettre = { version = "0.11", features = ["tokio1", "native-tls", "smtp", "file-transport", "async-std1"] }
lettre_email = "0.11"

# WebSockets
tokio-tungstenite = { version = "0.23", features = ["native-tls", "rustls-tls"] }
tungstenite = { version = "0.23", features = ["native-tls", "rustls-tls"] }

# Rate limiting
governor = { version = "0.7", features = ["std"] }

# Sentry
sentry = { version = "0.38", features = ["tokio", "tracing", "anyhow", "backtrace"] }
sentry-tracing = "0.38"

# LSP/IDE
rust-analyzer = { version = "0.1" }