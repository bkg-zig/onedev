services:
  onedev:
    image: 1dev/server
    volumes:
      # Der Rust-Rewrite verschob die Compose nach vendor/bkg-core-dev/...;
      # die OneDev-App-Daten bleiben am angestammten Ort im Clone.
      - ../../../../server-product/docker/onedev:/opt/onedev
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always
    ports:
      - "6610:6610"
      - "6611:6611"
    environment:
      ### This should be the same as POSTGRES_PASSWORD env below
      hibernate_connection_password: "changeit"

      hibernate_dialect: io.onedev.server.persistence.PostgreSQLDialect
      hibernate_connection_driver_class: org.postgresql.Driver
      hibernate_connection_url: jdbc:postgresql://postgres:5432/onedev
      hibernate_connection_username: postgres
    tty: true
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    # Supabase-DB: echte Postgres mit Rollen/Schemas (bkg-core-supadb:mango).
    # pgrust v0.4-beta lehnt PostgREST-Katalogabfragen hart ab (gravity refuse)
    # und ist deshalb als Supabase-DB ungeeignet.
    image: bkg-core-supadb:mango
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      ### Change this
      POSTGRES_PASSWORD: "changeit"
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "onedev"
    expose:
      - "5432"
    volumes:
      # Frisches PGDATA (altes pgrust-Verzeichnis ist inkompatibel).
      - ../../../../server-product/docker/supadb-data:/var/lib/postgresql/data
