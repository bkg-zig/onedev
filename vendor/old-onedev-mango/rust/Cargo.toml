[workspace]
resolver = "2"
members = [
    "crates/onedev-core",
    "crates/onedev-db",
    "crates/onedev-api",
    "crates/onedev-server",
    "crates/onedev-git",
    "crates/onedev-build",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/bkg-zig/onedev"

[workspace.dependencies]
anyhow = "1.0"
argon2 = "0.5.3"
axum = { version = "0.8.9", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
getrandom = "0.3"
hex = "0.4"
http = "1.3"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.49", features = ["full"] }
tower-http = { version = "0.6", features = ["catch-panic", "cors", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.21", features = ["serde", "v4"] }
