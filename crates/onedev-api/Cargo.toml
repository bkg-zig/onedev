[package]
name = "onedev-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "OneDev HTTP API - Axum Routes, Extractors, OpenAPI"

[dependencies]
onedev-core = { path = "../onedev-core" }
onedev-db = { path = "../onedev-db" }
onedev-auth = { path = "../onedev-auth" }
axum.workspace = true
axum-extra.workspace = true
tower.workspace = true
tower-http.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
simd-json.workspace = true
utoipa = { version = "5.4", features = ["axum_extras", "chrono", "uuid", "decimal", "url"] }
utoipa-swagger-ui = { version = "7.0", features = ["axum"] }
utoipa-axum = { version = "0.3" }
schemars = { version = "0.8", features = ["chrono", "uuid", "regex"] }
validator = { version = "0.19", features = ["derive"] }
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true
uuid.workspace = true
url.workspace = true
mime.workspace = true
