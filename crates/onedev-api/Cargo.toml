[package]
name = "onedev-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "OneDev HTTP API - Axum Routes, Extractors, OpenAPI"

[dependencies]
onedev-core = { path = "../onedev-core" }
onedev-db = { path = "../onedev-db" }
onedev-auth = { path = "../onedev-auth" }
onedev-git = { path = "../onedev-git" }
axum.workspace = true
axum-extra.workspace = true
tower.workspace = true
tower-http.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sqlx.workspace = true
utoipa ={ version = "5.4", features = ["axum_extras", "chrono", "uuid", "decimal", "url"] }
bitflags = { version = "2", features = ["serde"] }
schemars = { version = "0.8", features = ["chrono", "uuid"] }
validator = { version = "0.19", features = ["derive"] }
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true
uuid.workspace = true
url.workspace = true
mime.workspace = true
mime_guess.workspace = true
governor.workspace = true
flume.workspace = true
[dev-dependencies]
tempfile = "3"
