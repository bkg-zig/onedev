[package]
name = "onedev-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "OneDev Web UI - SSR Templates, Static Assets, DX Integration"

[dependencies]
onedev-core = { path = "../onedev-core" }
onedev-api = { path = "../onedev-api" }
onedev-auth = { path = "../onedev-auth" }
tera.workspace = true
askama.workspace = true
markdown.workspace = true
pulldown-cmark.workspace = true
syntect.workspace = true
axum = { workspace = true, default-features = false, features = ["macros", "json", "multipart"] }
axum-extra = { workspace = true, default-features = false, features = ["cookie", "cookie-signed", "cookie-private"] }
tower-http = { workspace = true, features = ["fs"] }
tower.workspace = true
figment.workspace = true
digest.workspace = true
tokio = { workspace = true }
getrandom = { version = "0.3", features = ["std"], default-features = false }
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
time.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
mime.workspace = true
mime_guess.workspace = true
percent-encoding.workspace = true
url.workspace = true
walkdir.workspace = true
ignore.workspace = true
glob.workspace = true
rust-embed = { version = "8.4", features = ["tokio"] }
minify-html = "0.17"
css-minify = "0.2"
js-sys = "0.3"
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }
md5.workspace = true
html-escape = "0.2"
rand = { version = "0.9", features = ["std", "os_rng"] }
axum-macros = "0.5"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "cookies", "gzip", "brotli"] }
sqlx.workspace = true

# WASM target: make all dependencies optional to exclude from WASM builds
# This is a server-side SSR crate and should not be compiled for WASM
[target.'cfg(target_family = "wasm")'.dependencies]
onedev-core = { path = "../onedev-core", optional = true }
onedev-api = { path = "../onedev-api", optional = true }
onedev-auth = { path = "../onedev-auth", optional = true }
tera = { workspace = true, optional = true }
askama = { workspace = true, optional = true }
markdown = { workspace = true, optional = true }
pulldown-cmark = { workspace = true, optional = true }
syntect = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
axum-extra = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
figment = { workspace = true, optional = true }
digest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
getrandom = { version = "0.3", features = ["wasm_js"], default-features = false, optional = true }
anyhow = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
time = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
mime = { workspace = true, optional = true }
mime_guess = { workspace = true, optional = true }
percent-encoding = { workspace = true, optional = true }
url = { workspace = true, optional = true }
walkdir = { workspace = true, optional = true }
ignore = { workspace = true, optional = true }
glob = { workspace = true, optional = true }
rust-embed = { version = "8.4", optional = true }
minify-html = { version = "0.17", optional = true }
css-minify = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
md5 = { workspace = true, optional = true }
html-escape = { version = "0.2", optional = true }
rand = { version = "0.9", optional = true }
axum-macros = { version = "0.5", optional = true }
reqwest = { version = "0.12", optional = true }
sqlx = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3.10"