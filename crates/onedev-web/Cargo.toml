[package]
name = "onedev-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "OneDev Web UI - SSR Templates, Static Assets, DX Integration"

[dependencies]
onedev-core = { path = "../onedev-core" }
onedev-api = { path = "../onedev-api" }
onedev-auth = { path = "../onedev-auth" }
tera.workspace = true
askama.workspace = true
markdown.workspace = true
pulldown-cmark.workspace = true
syntect.workspace = true
axum.workspace = true
axum-extra.workspace = true
tower-http = { workspace = true, features = ["fs"] }
tower.workspace = true
figment.workspace = true
digest.workspace = true
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
time.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
mime.workspace = true
mime_guess.workspace = true
percent-encoding.workspace = true
url.workspace = true
walkdir.workspace = true
ignore.workspace = true
glob.workspace = true
rust-embed = { version = "8.4", features = ["tokio"] }
minify-html = "0.17"
css-minify = "0.2"
js-sys = "0.3"
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }
md5.workspace = true
html-escape = "0.2"
rand = { version = "0.9", features = ["std", "os_rng"] }
axum-macros = "0.5"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "cookies", "gzip", "brotli"] }
sqlx.workspace = true

[dev-dependencies]
tempfile = "3.10"