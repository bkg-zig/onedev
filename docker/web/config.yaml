# OneDev Web UI configuration (SSR preview).
# Load with ONEDEV_WEB_CONFIG_DIR pointing at this directory.
server:
  bind_address: "0.0.0.0"
  port: 18081
  tls_enabled: false
  request_timeout_secs: 60
  max_body_size: 52428800

templates:
  template_dir: "crates/onedev-web/templates"
  auto_reload: true
  cache: false

static_assets:
  static_dir: "crates/onedev-web/static"
  cache_headers: false
  cache_max_age: 86400

api:
  base_url: "http://127.0.0.1:18080/api"
  timeout_secs: 30
  debug_logging: false

auth:
  session_cookie_name: "onedev_session"
  session_secret: "change-me-in-production"
  session_max_age: 86400
  secure_cookies: false
  same_site: "Lax"

features:
  ssr: true
  dark_mode: true
  syntax_highlight: true
  markdown: true
  realtime: false
